<svg xmlns="http://www.w3.org/2000/svg" aria-label="WHOOP 5.0 custom-channel frame envelope byte layout" role="img" viewBox="0 0 720 360"><style>.lbl,.sub{font-family:ui-monospace,&apos;SF Mono&apos;,Menlo,monospace}.lbl{font-size:13px;fill:#f3f1ec}.sub{font-size:11px;fill:rgba(243,241,236,.55)}.cap,.ttl{font-family:ui-sans-serif,-apple-system,&apos;Segoe UI&apos;,sans-serif;font-size:12px;fill:rgba(243,241,236,.6)}.ttl{font-size:13px;fill:rgba(243,241,236,.75);letter-spacing:.4px}.box{fill:#161615;stroke:#34363a}.boxa{fill:rgba(127,156,209,.12);stroke:#7f9cd1}.boxi{fill:rgba(243,241,236,.045);stroke:#4a4c50}.tick{stroke:rgba(243,241,236,.25);stroke-width:1}</style><rect width="719" height="359" x=".5" y=".5" fill="#0e0f11" stroke="#26282c" rx="14"/><text x="32" y="44" class="ttl">OUTER ENVELOPE — little-endian</text><text x="688" y="44" class="cap" text-anchor="end">total frame = len + 8 · len counts bytes [4:−4]</text><g><rect width="52" height="58" x="32" y="64" class="box" rx="6"/><rect width="52" height="58" x="90" y="64" class="box" rx="6"/><rect width="78" height="58" x="148" y="64" class="box" rx="6"/><rect width="78" height="58" x="232" y="64" class="box" rx="6"/><rect width="78" height="58" x="316" y="64" class="box" rx="6"/><rect width="180" height="58" x="400" y="64" class="boxa" rx="6"/><rect width="102" height="58" x="586" y="64" class="box" rx="6"/><text x="58" y="90" class="lbl" text-anchor="middle">0xAA</text><text x="58" y="108" class="sub" text-anchor="middle">SOF</text><text x="116" y="90" class="lbl" text-anchor="middle">0x01</text><text x="116" y="108" class="sub" text-anchor="middle">ver</text><text x="187" y="90" class="lbl" text-anchor="middle">len</text><text x="187" y="108" class="sub" text-anchor="middle">u16</text><text x="271" y="90" class="lbl" text-anchor="middle">field</text><text x="271" y="108" class="sub" text-anchor="middle">u16</text><text x="355" y="90" class="lbl" text-anchor="middle">crc16</text><text x="355" y="108" class="s